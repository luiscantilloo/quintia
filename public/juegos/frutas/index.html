<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Frutas · Quintia</title>
  <link rel="stylesheet" href="estilos.css">
  <script>
    (function () {
      var embed =
        window.parent !== window ||
        /(?:^|[?&])embed=1(?:&|$)/.test(location.search || "");
      if (embed) document.documentElement.classList.add("embed");
    })();
  </script>
  <style>
    /* Embed: puesto de frutas — HUD fino + tablero dominante */
    html.embed, html.embed body {
      min-height: 0 !important;
      height: 100%;
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }
    html.embed .app {
      display: flex !important;
      flex-direction: column;
      width: 100% !important;
      max-width: none !important;
      min-height: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0.5rem 0.65rem max(0.5rem, env(safe-area-inset-bottom)) !important;
      box-sizing: border-box;
    }
    html.embed .frutas-inicio {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      width: 100%;
      padding: 0.5rem 0.25rem 0.75rem;
      box-sizing: border-box;
    }
    html.embed .frutas-inicio-card {
      width: min(100%, 21rem);
      overflow: hidden;
      border-radius: 1.35rem;
      background: #fff;
      border: 1px solid #e5e0d5;
      box-shadow: 0 16px 40px rgba(15, 45, 59, 0.12);
    }
    html.embed .frutas-inicio-body {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      padding: 1.1rem 1.15rem 1.2rem;
      text-align: center;
    }
    html.embed .frutas-inicio-frutas {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      margin: 0.15rem 0 0.25rem;
    }
    html.embed .frutas-inicio-fruta {
      display: block;
      width: 3.25rem !important;
      height: 3.25rem !important;
      max-width: 3.25rem;
      max-height: 3.25rem;
      object-fit: contain;
    }
    html.embed .frutas-inicio-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.25;
      color: #0f2d3b;
    }
    html.embed .frutas-inicio-copy {
      margin: 0 0 0.25rem;
      font-size: 0.9rem;
      line-height: 1.4;
      color: #5b6770;
    }
    html.embed .frutas-play {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      gap: 0.55rem;
      width: 100%;
    }
    html.embed .frutas-hud {
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      padding: 0.85rem 0.9rem 0.8rem;
      border-radius: 1.1rem;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #e5e0d5;
      box-shadow: 0 10px 28px rgba(15, 45, 59, 0.08);
    }
    html.embed .frutas-hud .mensaje {
      margin: 0;
      text-align: center;
      font-size: 0.95rem;
      line-height: 1.35;
      font-weight: 600;
      color: #0f2d3b;
    }
    html.embed .frutas-chips {
      display: grid !important;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.5rem;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    html.embed .frutas-chips .chip {
      position: relative;
      display: flex !important;
      align-items: center;
      justify-content: center;
      gap: 0.15rem;
      margin: 0;
      min-height: 2.15rem;
      padding: 0.35rem 0.5rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.01em;
      color: #0f2d3b;
      white-space: nowrap;
      box-sizing: border-box;
    }
    html.embed .frutas-chips .chip-nivel { background: #bbf3e3; }
    html.embed .frutas-chips .chip-mov { background: #a4e1eb; }
    html.embed .frutas-chips .chip-puntos { background: #a5f2df; }
    html.embed .frutas-meta {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    html.embed .frutas-meta .meta {
      height: 0.4rem;
      width: 100%;
      overflow: hidden;
      border-radius: 999px;
      background: #e8e4dc;
    }
    html.embed .frutas-meta .meta-relleno {
      display: block;
      height: 100%;
      border-radius: inherit;
    }
    html.embed .frutas-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    html.embed .frutas-meta-row .meta-texto {
      margin: 0;
      font-size: 0.8rem;
      color: #5b6770;
    }
    html.embed .frutas-niveles {
      flex: none;
      min-height: 2rem;
      padding: 0.25rem 0.75rem;
      border: 1.5px solid #6c04c9;
      border-radius: 999px;
      background: #fff;
      color: #6c04c9;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    html.embed .frutas-stage {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 0.15rem 0 0.35rem;
    }
    html.embed .tablero {
      width: min(100%, 34rem, calc(100dvh - 14.5rem)) !important;
      max-width: 100%;
      margin: 0 auto;
      padding: 0.55rem;
      border-radius: 1.35rem;
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 244, 232, 0.95), transparent 55%),
        rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(229, 224, 213, 0.95);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.8) inset,
        0 16px 36px rgba(15, 45, 59, 0.1);
    }
    @media (max-width: 380px) {
      html.embed .app { padding: 0.35rem 0.4rem 0.4rem !important; }
      html.embed .tablero { width: min(100%, calc(100dvh - 13.5rem)) !important; padding: 0.4rem; gap: 0.35rem !important; }
      html.embed .frutas-hud { padding: 0.45rem 0.55rem; }
    }
    @media (min-width: 420px) and (min-height: 700px) {
      html.embed .tablero { width: min(100%, 28rem, calc(100dvh - 15rem)) !important; }
    }
    /* Modal victoria: centrado, sin sheet inferior ni texto duplicado */
    html.embed.frutas-modal-abierto .frutas-hud {
      visibility: hidden;
      pointer-events: none;
    }
    html.embed .frutas-decision {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      box-sizing: border-box;
      background: rgba(15, 45, 59, 0.62);
      backdrop-filter: blur(3px);
    }
    html.embed .frutas-decision-card {
      width: min(100%, 20.5rem);
      overflow: hidden;
      border-radius: 1.35rem;
      background: #fff;
      box-shadow: 0 22px 48px rgba(15, 45, 59, 0.28);
    }
    html.embed .frutas-decision-arco {
      display: block;
      height: 0.4rem;
      width: 100%;
      background: linear-gradient(90deg, #61f0d2, #31c6e6, #6c04c9);
    }
    html.embed .frutas-decision-body {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      padding: 1.15rem 1.15rem 1.2rem;
      text-align: center;
    }
    html.embed .frutas-decision-eyebrow {
      margin: 0;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6c04c9;
    }
    html.embed .frutas-decision-title {
      margin: 0;
      font-family: var(--q-fuente-titulo), Montserrat, sans-serif;
      font-size: 1.65rem;
      font-weight: 700;
      line-height: 1.1;
      color: #0f2d3b;
    }
    html.embed .frutas-decision-copy {
      margin: 0 0 0.35rem;
      font-size: 0.95rem;
      line-height: 1.35;
      color: #5b6770;
    }
    html.embed .frutas-decision-actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    html.embed .frutas-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 2.85rem;
      padding: 0.65rem 1rem;
      border-radius: 0.9rem;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      box-sizing: border-box;
    }
    html.embed .frutas-btn-primario {
      border: 0;
      background: #6c04c9;
      color: #fff;
      box-shadow: 0 10px 22px rgba(108, 4, 201, 0.28);
    }
    html.embed .frutas-btn-secundario {
      border: 1.5px solid #6c04c9;
      background: #fff;
      color: #6c04c9;
      box-shadow: none;
    }
    /* Resultado de partida */
    html.embed .frutas-fin {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 0.5rem 0.25rem 0.75rem;
      box-sizing: border-box;
    }
    html.embed .frutas-fin-card {
      width: min(100%, 21rem);
      overflow: hidden;
      border-radius: 1.35rem;
      background: #fff;
      border: 1px solid #e5e0d5;
      box-shadow: 0 16px 40px rgba(15, 45, 59, 0.12);
    }
    html.embed .frutas-fin-body {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding: 1.2rem 1.15rem 1.25rem;
      text-align: center;
    }
    html.embed .frutas-fin-title {
      margin: 0;
      font-family: var(--q-fuente-titulo), Montserrat, sans-serif;
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1.15;
      color: #0f2d3b;
    }
    html.embed .frutas-fin-score {
      margin: 0.15rem 0 0.1rem;
      font-family: var(--q-fuente-titulo), Montserrat, sans-serif;
      font-size: 2.35rem;
      font-weight: 700;
      line-height: 1;
      color: #6c04c9;
      letter-spacing: -0.02em;
    }
    html.embed .frutas-fin-copy {
      margin: 0 0 0.35rem;
      font-size: 0.95rem;
      color: #5b6770;
    }
    html.embed .frutas-fin-nota {
      margin: 0 0 0.25rem;
      font-size: 0.85rem;
      line-height: 1.35;
      color: #5b6770;
    }
    html.embed .frutas-fin .frutas-decision-actions {
      margin-top: 0.35rem;
    }
    /* Lista de niveles embebida */
    html.embed .frutas-niveles-vista {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      max-width: 24rem;
      margin: 0 auto;
      padding: 0.35rem 0.15rem 0.75rem;
      box-sizing: border-box;
      overflow-y: auto;
      max-height: 100%;
    }
    html.embed .frutas-niveles-title {
      margin: 0;
      font-family: var(--q-fuente-titulo), Montserrat, sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: #0f2d3b;
    }
    html.embed .frutas-niveles-copy {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.35;
      color: #5b6770;
    }
    html.embed .frutas-niveles-lista {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    html.embed .frutas-niveles-cerrados {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    html.embed .frutas-niveles-label {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 700;
      color: #5b6770;
    }
    html.embed .frutas-niveles-vista .font-titulo {
      font-size: 1.15rem !important;
    }
    html.embed .frutas-niveles-vista .text-xl,
    html.embed .frutas-niveles-vista .text-lg {
      font-size: 0.9rem !important;
      line-height: 1.35 !important;
    }
    html.embed .frutas-niveles-vista .h-\[4\.5rem\],
    html.embed .frutas-niveles-vista .w-\[4\.5rem\] {
      height: 2.75rem !important;
      width: 2.75rem !important;
    }
    html.embed .frutas-niveles-vista .p-5 {
      padding: 0.85rem !important;
    }
  </style>
</head>
<body>
  <main class="app" id="app"></main>
  <noscript>
    <p>Active JavaScript para jugar Frutas.</p>
  </noscript>

  <template id="molde-play">
    <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
      <path fill="currentColor" d="M8 5.5v13l11-6.5z"/>
    </svg>
  </template>

  <script src="src/tablero.js"></script>
  <script src="src/vista.js"></script>
  <script src="src/partida.js"></script>
</body>
</html>
